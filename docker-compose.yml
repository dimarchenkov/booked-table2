version: "3.9"

services:
  api:
    build: .
    command: bash -c "python /app/app/scripts/wait_for_db.py && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A app.workers.celery_app:celery_app worker -B -l info
    env_file: .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - postgres
      - redis

  telegram_bot:
    build: .
    command: python -m telegram_bot.main
    env_file: .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - api
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: booked
      POSTGRES_PASSWORD: booked
      POSTGRES_DB: booked
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
